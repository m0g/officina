backend:
  name: git-gateway
  branch: master

media_folder: '/src/_assets/images/uploads'

collections:
  - name: 'site'
    label: 'Site'
    extension: md
    files:
      - label: 'Home (desks & room)'
        name: 'home'
        file: 'src/en/index.md'
        extension: md
        fields:
          - { label: 'Title (H1)', name: 'title', widget: 'string' }
          - { label: 'Subtitle', name: 'subtitle', widget: 'string', required: false }
          - { label: 'SEO title (browser tab / Google)', name: 'seo_title', widget: 'string' }
          - { label: 'SEO description (Google snippet)', name: 'meta_description', widget: 'text' }
          - { label: 'SEO description – used instead while the room is on offer', name: 'meta_description_room', widget: 'text', required: false }
          - { label: 'Intro', name: 'body', widget: 'markdown' }
          - { label: 'Availability line (under the intro)', name: 'availability', widget: 'text', required: false }
          - { label: 'Availability line – used instead while the room is on offer', name: 'availability_room', widget: 'text', required: false }
          - { label: 'Featured image', name: 'image', widget: 'image' }
          - { label: 'Fix desk title', name: 'fix_desk_title', widget: 'string' }
          - { label: 'Fix desk content', name: 'fix_desk_content', widget: 'markdown' }
          - { label: 'Fix desk image', name: 'fix_desk_image', widget: 'image' }
          - { label: 'Fix desk price', name: 'fix_desk_price', widget: 'string' }
          - { label: 'Flex desk title', name: 'flex_desk_title', widget: 'string' }
          - { label: 'Flex desk content', name: 'flex_desk_content', widget: 'markdown' }
          - { label: 'Flex desk image', name: 'flex_desk_image', widget: 'image' }
          - { label: 'Flex desk price', name: 'flex_desk_price', widget: 'string' }
          # The whole room block is also hidden by the `room` feature flag in src/_data/features.js
          - { label: 'Room title (leave empty to hide the room section)', name: 'room_title', widget: 'string', required: false }
          - { label: 'Room content', name: 'room_content', widget: 'markdown', required: false }
          - { label: 'Room image', name: 'room_image', widget: 'image', required: false }
          - { label: 'Room price', name: 'room_price', widget: 'string', required: false }
          - { label: 'Desk button label', name: 'apply_here', widget: 'string' }
          - { label: 'Room button label', name: 'room_apply', widget: 'string', required: false }
          - { label: 'Trial day info', name: 'trial_day_info', widget: 'string' }
          - { label: 'FAQ title', name: 'faq_title', widget: 'string', required: false }
          - { label: 'Key facts (plain text under the FAQ title – price, address, notice period, trial day)', name: 'key_facts', widget: 'text', required: false }
          - { label: 'Key facts – used instead while the room is on offer', name: 'key_facts_room', widget: 'text', required: false }
          - label: 'FAQ'
            name: 'faq'
            widget: 'list'
            required: false
            fields:
              - { label: 'Question', name: 'q', widget: 'string' }
              - { label: 'Answer (HTML links allowed)', name: 'a', widget: 'text' }
              - { label: 'Answer – used instead while the room is on offer', name: 'a_room', widget: 'text', required: false }
              - { label: 'Only show while the room is on offer', name: 'room', widget: 'boolean', required: false, default: false }
      - label: 'About'
        name: 'about'
        file: 'src/en/about.md'
        extension: md
        fields:
          - { label: 'Title (H1)', name: 'title', widget: 'string' }
          - { label: 'SEO title (browser tab / Google)', name: 'seo_title', widget: 'string' }
          - { label: 'SEO description (Google snippet)', name: 'meta_description', widget: 'text' }
          - { label: 'Description', name: 'description', widget: 'text' }
          - { label: 'Featured image', name: 'image', widget: 'image' }
          - { label: 'Section title', name: 'how_it_works_title', widget: 'string' }
          - { label: 'Section intro', name: 'how_it_works_description', widget: 'text' }
          - { label: 'Collective title', name: 'collective_title', widget: 'string' }
          - { label: 'Collective text', name: 'the_collective', widget: 'text' }
          - { label: 'Collective button', name: 'collective_cta', widget: 'string' }
          - { label: 'Events title', name: 'events_title', widget: 'string' }
          - { label: 'Events text', name: 'events', widget: 'text' }
          - { label: 'Events button', name: 'events_cta', widget: 'string' }
          - { label: 'Residency title', name: 'residency_title', widget: 'string' }
          - { label: 'Residency text', name: 'art_residency', widget: 'text' }
          - { label: 'Residency button', name: 'residency_cta', widget: 'string' }
          - { label: 'Contact title', name: 'contact_title', widget: 'string' }
          - { label: 'Contact text', name: 'contact_text', widget: 'text' }
          - { label: 'Contact text – used instead while the room is on offer', name: 'contact_text_room', widget: 'text', required: false }
          - { label: 'Contact button', name: 'contact_cta', widget: 'string' }
      - label: 'The Collective'
        name: 'Collective'
        file: 'src/en/collective.md'
        extension: md
        fields:
          - { label: 'Title (H1)', name: 'title', widget: 'string' }
          - { label: 'SEO title (browser tab / Google)', name: 'seo_title', widget: 'string' }
          - { label: 'SEO description (Google snippet)', name: 'meta_description', widget: 'text' }
          - { label: 'Description', name: 'body', widget: 'markdown' }
          - { label: 'Featured image', name: 'image', widget: 'image' }
      - label: 'Events'
        name: 'Events'
        file: 'src/en/events.md'
        extension: md
        fields:
          - { label: 'Title (H1)', name: 'title', widget: 'string' }
          - { label: 'SEO title (browser tab / Google)', name: 'seo_title', widget: 'string' }
          - { label: 'SEO description (Google snippet)', name: 'meta_description', widget: 'text' }
          - { label: 'Description', name: 'body', widget: 'markdown' }
          - { label: 'Featured image', name: 'image', widget: 'image' }
      - label: 'Artist residency (archive)'
        name: 'Artists'
        file: 'src/en/artists.md'
        extension: md
        fields:
          - { label: 'Title (H1)', name: 'title', widget: 'string' }
          - { label: 'SEO title (browser tab / Google)', name: 'seo_title', widget: 'string' }
          - { label: 'SEO description (Google snippet)', name: 'meta_description', widget: 'text' }
          - { label: 'Description', name: 'body', widget: 'markdown' }
          - { label: 'Featured image', name: 'image', widget: 'image' }

  - name: 'artist' # Used in routes, e.g., /admin/collections/blog
    label: 'Residents (archive)' # Used in the UI
    folder: 'src/en/artists' # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: '{{name}}' # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: 'Name', name: 'name', widget: 'string' }
      - {
          label: 'Position / order',
          name: 'position',
          widget: 'number',
          default: 1,
        }
      - { label: 'Period', name: 'period', widget: 'string' }
      - { label: 'Website', name: 'website', widget: 'string' }
      - { label: 'Featured image', name: 'image', widget: 'image' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
      - { label: 'Tags', name: 'tags', widget: 'hidden', default: 'artist' }

  - name: 'collective' # Used in routes, e.g., /admin/collections/blog
    label: 'Collective' # Used in the UI
    folder: 'src/en/collective' # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: '{{name}}' # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: 'Name', name: 'name', widget: 'string' }
      - {
          label: 'Position / order',
          name: 'position',
          widget: 'number',
          default: 1,
        }
      - { label: 'Job', name: 'job', widget: 'string', required: false }
      - {
          label: 'Pronouns',
          name: 'pronouns',
          widget: 'string',
          required: false,
        }
      - { label: 'Website', name: 'website', widget: 'string', required: false }
      - { label: 'Featured image', name: 'image', widget: 'image' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
      - { label: 'Tags', name: 'tags', widget: 'hidden', default: 'collective' }

  - name: 'event' # Used in routes, e.g., /admin/collections/blog
    label: 'Events' # Used in the UI
    folder: 'src/en/events' # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: '{{name}}' # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Link', name: 'link', widget: 'string' }
      - { label: 'Date', name: 'date', widget: 'datetime' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
      - { label: 'Tags', name: 'tags', widget: 'hidden', default: 'event' }
